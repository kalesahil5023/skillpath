global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  # ── 1. Scrape Prometheus itself ────────────────────────────────────────────
  - job_name: "prometheus"
    scrape_timeout: 4s
    static_configs:
      - targets: ["localhost:9090"]

  # ── 2. Scrape Django REST Framework API & Database Queries ─────────────────
  - job_name: "skillsprint-backend"
    metrics_path: "/metrics"
    scrape_timeout: 4s
    static_configs:
      - targets: ["backend-1:8000", "backend-2:8000", "backend-3:8000"]

  # ── 3. Scrape PostgreSQL Database Metrics ──────────────────────────────────
  - job_name: "skillsprint-postgres"
    scrape_timeout: 4s
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # ── 4. Scrape Nginx Web Server Metrics ─────────────────────────────────────
  - job_name: "skillsprint-nginx"
    scrape_timeout: 4s
    static_configs:
      - targets: ["nginx-exporter:9113"]
