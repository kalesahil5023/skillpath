services:
  # ── PostgreSQL Database ────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: skillsprint-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skillsprint}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-skillsprint}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - skillpath-network

  # ── Django REST Framework Backend ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillsprint-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-skillsprint}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-skillpath-super-secret-key-for-container-deployment-change-in-prod}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - DB_SSL_REQUIRE=${DB_SSL_REQUIRE:-False}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:3000,http://127.0.0.1,http://127.0.0.1:80,http://127.0.0.1:3000}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:3000,http://127.0.0.1,http://127.0.0.1:80,http://127.0.0.1:3000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - BLACKSMS_API_KEY=${BLACKSMS_API_KEY:-}
      - BLACKSMS_API_URL=${BLACKSMS_API_URL:-https://blacksms.in/api/v1/bulk-sms}
      - BLACKSMS_SENDER_ID=${BLACKSMS_SENDER_ID:-}
      - BLACKSMS_DLT_TEMPLATE_ID=${BLACKSMS_DLT_TEMPLATE_ID:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_staticfiles:/app/staticfiles
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - skillpath-network

  # ── React Vite Frontend (Nginx Reverse Proxy) ──────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-}
    container_name: skillsprint-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - skillpath-network

  # ── Cloudflare Tunnel (Secure Public Ingress with Edge Caching) ────────────
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: skillsprint-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - skillpath-network
    profiles:
      - tunnel

  # ── Prometheus (Metrics Scraper & Time-Series DB) ──────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: skillsprint-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - skillpath-network

  # ── Grafana (Real-Time Visual Dashboards & Analytics) ──────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    container_name: skillsprint-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    networks:
      - skillpath-network

  # ── PostgreSQL Prometheus Exporter ─────────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: skillsprint-postgres-exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-skillsprint}?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - skillpath-network

  # ── Nginx Prometheus Exporter ──────────────────────────────────────────────
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: skillsprint-nginx-exporter
    restart: unless-stopped
    command:
      - -nginx.scrape-uri=http://frontend:80/stub_status
    ports:
      - "9113:9113"
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - skillpath-network

  # ── Locust Load Testing Suite ─────────────────────────────────────────────
  locust:
    image: locustio/locust:2.32.0
    container_name: skillsprint-locust
    restart: unless-stopped
    ports:
      - "8089:8089"
    volumes:
      - ./locustfile.py:/mnt/locust/locustfile.py
    command: -f /mnt/locust/locustfile.py --host http://frontend:80
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
    networks:
      - skillpath-network

volumes:
  postgres_data:
    name: skillsprint_postgres_data
  backend_staticfiles:
    name: skillsprint_backend_staticfiles
  prometheus_data:
    name: skillsprint_prometheus_data
  grafana_data:
    name: skillsprint_grafana_data

networks:
  skillpath-network:
    name: skillsprint_network
    driver: bridge
